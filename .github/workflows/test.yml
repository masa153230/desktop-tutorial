name: テスト

on:
  # 作業ブランチは PR で走らせる。push にも入れると同じコミットで二重に走る
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じ PR に続けて push したら古い方を止める
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest (26.04) は Playwright 1.56 が未対応なので固定する
          - os: ubuntu-24.04
            project: chromium
          # iPhone の Safari と同じ WebKit。mp4 (H.264) を再生できる macOS で動かす
          - os: macos-latest
            project: webkit
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.project }}
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: report-${{ matrix.project }}
          path: tests/playwright-report
