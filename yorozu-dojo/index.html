<title>よろず道場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+Symbols+2&display=swap">
<style>
/* Layout: 1カラムの道場アプリ。ホーム→コースの道（ノードが蛇行）→レッスン（下部に判定バー）→修了印 */
:root {
  --bg: #f2f4ee;
  --surface: #ffffff;
  --surface-2: #e8ece2;
  --ink: #1b2230;
  --muted: #5b6573;
  --line: #d5dbcf;
  --accent: #2f3d9c;       /* 藍 */
  --accent-ink: #ffffff;
  --shu: #c9362c;          /* 朱印 */
  --gold: #d99a00;
  --good: #188a4b;
  --good-bg: #dff3e6;
  --bad: #c73a3a;
  --bad-bg: #fbe3e1;
  --c-en: #2f6fe0;
  --c-mn: #c8312f;
  --c-ch: #8a5a2b;
  --c-mj: #0d7a5a;
  --d-en: #2a62c9;          /* 白文字を載せる濃い面（両テーマ共通） */
  --d-mn: #b52d2a;
  --d-ch: #7d5127;
  --d-mj: #0c6e51;
  --sq-light: #ecd9b9;
  --sq-dark: #b58863;
  --tile-face: #fffcf3;
  --tile-face-2: #efe7d3;
  --tile-edge: #d6cbb0;
  --tile-back: #1d7a59;
  --shadow: 0 1px 2px rgba(27, 34, 48, .06), 0 4px 14px rgba(27, 34, 48, .06);
  --font-ui: "Nunito", "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Nunito", system-ui, sans-serif;
  --font-num: "Nunito", system-ui, sans-serif;
  --font-piece: "Noto Sans Symbols 2", "Segoe UI Symbol", "Apple Symbols", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --surface: #1a2029; --surface-2: #232b36; --ink: #e8ecf1; --muted: #9ba5b3; --line: #2e3744;
    --accent: #8f9bff; --accent-ink: #10142a; --shu: #ff6a5c; --gold: #ffc23d;
    --good: #43d184; --good-bg: #173326; --bad: #ff7a72; --bad-bg: #3a1d1d;
    --c-en: #74a3ff; --c-mn: #ff6f66; --c-ch: #d7a06a; --c-mj: #3ccb9b;
    --sq-light: #d9c4a1; --sq-dark: #9d7451;
    --tile-face: #fbf6e8; --tile-face-2: #e6dcc4; --tile-edge: #b9ad90; --tile-back: #1a6b4f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --surface: #1a2029; --surface-2: #232b36; --ink: #e8ecf1; --muted: #9ba5b3; --line: #2e3744;
  --accent: #8f9bff; --accent-ink: #10142a; --shu: #ff6a5c; --gold: #ffc23d;
  --good: #43d184; --good-bg: #173326; --bad: #ff7a72; --bad-bg: #3a1d1d;
  --c-en: #74a3ff; --c-mn: #ff6f66; --c-ch: #d7a06a; --c-mj: #3ccb9b;
  --sq-light: #d9c4a1; --sq-dark: #9d7451;
  --tile-face: #fbf6e8; --tile-face-2: #e6dcc4; --tile-edge: #b9ad90; --tile-back: #1a6b4f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#app { min-height: 100%; display: flex; flex-direction: column; }
.wrap { width: 100%; max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ico { width: 1.15em; height: 1.15em; display: inline-block; vertical-align: -0.2em; flex: none; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 800; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }

/* ---- ホーム ---- */
.brand { display: flex; align-items: center; gap: 12px; padding-block: 18px 6px; }
.stamp { width: 40px; height: 40px; border-radius: 7px; background: var(--shu); color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: 24px; transform: rotate(-4deg); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); flex: none; }
.brand h1 { font-size: 24px; font-weight: 900; letter-spacing: .04em; }
.brand .tag { color: var(--muted); font-size: 12.5px; margin-top: -2px; }
.brand .spacer { flex: 1; }
.icon-btn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding-block: 12px; }
.stat { background: var(--surface); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .lbl { font-size: 11.5px; color: var(--muted); letter-spacing: .04em; }
.stat .val { font-size: 24px; line-height: 1.1; display: flex; align-items: center; gap: 6px; }
.stat .val small { font-size: 13px; color: var(--muted); font-weight: 700; }
.stat.streak .ico { color: var(--gold); }
.stat.streak.off .ico { color: var(--line); }
.goalbar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.goalbar i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .5s ease; }
.sec-title { font-size: 13px; letter-spacing: .1em; color: var(--muted); font-weight: 800; margin: 14px 0 8px; }
.courses { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 560px) { .courses { grid-template-columns: 1fr 1fr; } }
.ccard { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 0; border-radius: 18px; padding: 14px; box-shadow: var(--shadow); min-width: 0; transition: transform .12s ease; }
.ccard:active { transform: scale(.985); }
.ccard .cic { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; color: #fff; font-family: var(--font-num); font-weight: 900; font-size: 22px; }
.ccard .cic.ch { font-family: var(--font-piece); font-size: 34px; font-weight: 400; }
.ccard .cic.mj { font-family: var(--font-display); }
.ccard .cname { font-family: var(--font-display); font-weight: 900; font-size: 18px; }
.ccard .csub { color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.ccard .cbody { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.cprog { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.cprog .bar { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.cprog .bar i { display: block; height: 100%; border-radius: 99px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; background: var(--surface); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); }
.week .d { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.week .col { width: 100%; max-width: 26px; height: 56px; border-radius: 8px; background: var(--surface-2); display: flex; align-items: flex-end; overflow: hidden; }
.week .col i { display: block; width: 100%; background: var(--accent); border-radius: 8px; min-height: 0; }
.week .d.today { color: var(--ink); font-weight: 800; }
.week .d.hit .col i { background: var(--gold); }
.foot { color: var(--muted); font-size: 12px; text-align: center; padding-block: 22px 28px; display: flex; flex-direction: column; gap: 4px; }
.sync { display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.ok::before { background: var(--good); }
.sync.err::before { background: var(--bad); }

/* ---- コース ---- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.topbar .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.topbar h2 { font-size: 18px; font-weight: 900; flex: 1; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 4px 10px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 800; white-space: nowrap; }
.hero { border-radius: 20px; color: #fff; padding: 18px; margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.hero p { margin: 0; opacity: .92; font-size: 14px; }
.hero .row { display: flex; gap: 8px; flex-wrap: wrap; }
.hbtn { border: 0; border-radius: 14px; padding: 11px 16px; font-weight: 900; font-size: 15px; background: #fff; color: #1b2230; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.hbtn.ghost { background: rgba(255,255,255,.18); color: #fff; box-shadow: none; }
.unit { margin-top: 26px; }
.unit-h { display: flex; flex-direction: column; gap: 2px; }
.unit-h .no { font-family: var(--font-num); font-size: 12px; letter-spacing: .14em; font-weight: 900; }
.unit-h h3 { font-size: 19px; font-weight: 900; }
.unit-h p { margin: 0; color: var(--muted); font-size: 13px; }
.path { display: flex; flex-direction: column; gap: 6px; padding-block: 14px 4px; }
.node { display: flex; align-items: center; gap: 14px; background: none; border: 0; padding: 4px; text-align: left; }
.node:nth-child(3n+2) { margin-left: 22%; }
.node:nth-child(3n+3) { margin-left: 11%; }
.node .ball { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; border: 3px solid var(--cc); color: var(--cc); background: var(--surface); flex: none; font-family: var(--font-num); font-weight: 900; font-size: 20px; position: relative; box-shadow: 0 4px 0 var(--line); transition: transform .12s ease; }
.node:active .ball { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.node.done .ball { background: var(--cd); border-color: var(--cd); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--cd) 60%, #000); }
.node.next .ball::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 3px solid var(--cc); opacity: .45; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { from { transform: scale(.9); opacity: .6; } to { transform: scale(1.18); opacity: 0; } }
.node .nl { display: flex; flex-direction: column; min-width: 0; }
.node .nl b { font-size: 15px; }
.node .nl span { font-size: 12px; color: var(--muted); }
.node .badge { position: absolute; right: -6px; bottom: -4px; background: var(--gold); color: #1b1300; font-size: 11px; border-radius: 99px; padding: 1px 6px; font-weight: 900; }
.start-tag { display: inline-block; background: var(--cd); color: #fff; font-size: 11px; font-weight: 900; border-radius: 6px; padding: 1px 7px; letter-spacing: .08em; margin-right: 6px; vertical-align: 1px; }

/* ---- レッスン ---- */
.lesson { flex: 1; display: flex; flex-direction: column; min-height: 100%; }
.lbar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 14px 8px; }
.pbar { flex: 1; height: 14px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.pbar i { display: block; height: 100%; border-radius: 99px; background: var(--cc); transition: width .35s ease; box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); }
.combo { font-size: 13px; font-weight: 900; color: var(--gold); min-width: 44px; text-align: right; }
.lbody { flex: 1; }
.lbody .wrap { padding-block: 10px 24px; }
.eyebrow { font-size: 12.5px; font-weight: 800; letter-spacing: .08em; color: var(--cc); margin-top: 4px; }
.q { font-family: var(--font-display); font-weight: 900; font-size: 20px; margin: 4px 0 14px; text-wrap: balance; }
.prompt { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
.prompt .say { flex: none; width: 52px; height: 52px; border-radius: 14px; border: 0; background: var(--cd); color: #fff; display: grid; place-items: center; box-shadow: 0 3px 0 color-mix(in srgb, var(--cd) 60%, #000); }
.prompt .say .ico { width: 26px; height: 26px; }
.bubble { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; min-width: 0; flex: 1; }
.bubble .main { font-size: 21px; font-weight: 800; line-height: 1.35; overflow-wrap: anywhere; }
.bubble .main.big { font-size: 64px; line-height: 1.1; text-align: center; font-family: var(--font-num); }
.bubble .reading { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choices.grid { display: grid; grid-template-columns: 1fr 1fr; }
.choice { display: flex; align-items: center; gap: 12px; text-align: left; border: 2px solid var(--line); border-bottom-width: 4px; background: var(--surface); border-radius: 14px; padding: 12px 14px; font-weight: 700; font-size: 16px; min-height: 54px; min-width: 0; }
.choice .kbd { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); color: var(--muted); display: grid; place-items: center; font-size: 12px; font-family: var(--font-num); }
.choice .ct { min-width: 0; overflow-wrap: anywhere; }
.choice .ct.cyr { font-size: 28px; font-family: var(--font-num); }
.choice.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.choice.sel .kbd { border-color: var(--accent); color: var(--accent); }
.choice.right { border-color: var(--good); background: var(--good-bg); }
.choice.wrong { border-color: var(--bad); background: var(--bad-bg); }
.choice:disabled { cursor: default; }
.listen-big { display: flex; gap: 12px; justify-content: center; margin: 6px 0 22px; }
.listen-big button { border: 0; border-radius: 18px; background: var(--cd); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 0 color-mix(in srgb, var(--cd) 60%, #000); }
.listen-big .main-say { width: 120px; height: 96px; }
.listen-big .main-say .ico { width: 46px; height: 46px; }
.listen-big .slow { width: 72px; height: 96px; font-size: 13px; font-weight: 900; gap: 0; }
/* 並べかえ */
.answer-line { min-height: 112px; border-bottom: 2px solid var(--line); background-image: linear-gradient(transparent 54px, var(--line) 54px, var(--line) 56px, transparent 56px); background-size: 100% 56px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; padding: 6px 0; margin-bottom: 22px; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.wtile { border: 2px solid var(--line); border-bottom-width: 4px; background: var(--surface); border-radius: 12px; padding: 7px 12px; font-weight: 800; font-size: 16px; }
.wtile.ghost { visibility: hidden; }
/* 入力 */
.type-in { width: 100%; min-height: 120px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); padding: 12px 14px; font: inherit; font-size: 18px; color: var(--ink); resize: vertical; }
/* ペア */
.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pairs .colp { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pbtn { border: 2px solid var(--line); border-bottom-width: 4px; background: var(--surface); border-radius: 14px; padding: 12px 10px; font-weight: 800; min-height: 58px; overflow-wrap: anywhere; font-size: 15px; }
.pbtn.cyr { font-size: 22px; }
.pbtn.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.pbtn.ok { border-color: var(--line); color: var(--muted); opacity: .45; }
.pbtn.ng { border-color: var(--bad); background: var(--bad-bg); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
/* フッター判定 */
.lfoot { position: sticky; bottom: 0; border-top: 2px solid var(--line); background: var(--bg); padding-bottom: env(safe-area-inset-bottom, 0px); }
.lfoot .wrap { display: flex; flex-direction: column; gap: 10px; padding-block: 14px 16px; }
.lfoot.good { background: var(--good-bg); border-color: transparent; }
.lfoot.bad { background: var(--bad-bg); border-color: transparent; }
.fb-title { font-family: var(--font-display); font-weight: 900; font-size: 20px; display: flex; align-items: center; gap: 8px; }
.lfoot.good .fb-title { color: var(--good); }
.lfoot.bad .fb-title { color: var(--bad); }
.fb-ans { font-weight: 800; overflow-wrap: anywhere; }
.fb-ex { font-size: 14px; color: var(--ink); opacity: .85; }
.fb-tiles { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.cta { width: 100%; border: 0; border-radius: 16px; padding: 14px; font-weight: 900; font-size: 17px; letter-spacing: .06em; background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 55%, #000); }
.lfoot.good .cta { background: var(--good); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--good) 55%, #000); }
.lfoot.bad .cta { background: var(--bad); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--bad) 55%, #000); }
.cta:disabled { background: var(--surface-2); color: var(--muted); box-shadow: none; cursor: default; }
.cta:active:not(:disabled) { transform: translateY(2px); }
.subtle { border: 0; background: none; color: var(--muted); font-weight: 800; font-size: 14px; padding: 4px; }

/* ---- チェス盤 ---- */
.board-wrap { width: min(100%, 400px); margin: 0 auto 16px; }
.board { display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; aspect-ratio: 1; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 0 color-mix(in srgb, var(--sq-dark) 55%, #000); container-type: inline-size; user-select: none; }
.sq { position: relative; display: grid; place-items: center; border: 0; padding: 0; margin: 0; aspect-ratio: 1; }
.sq.l { background: var(--sq-light); }
.sq.d { background: var(--sq-dark); }
.sq .pc { font-family: var(--font-piece); font-size: 34px; font-size: 10.2cqw; line-height: 1; pointer-events: none; transition: transform .15s ease; }
.pc.w { color: #fbfbf8; -webkit-text-stroke: 1.1px #2a2520; paint-order: stroke fill; text-shadow: 0 1px 1px rgba(0,0,0,.35); }
.pc.b { color: #24201c; text-shadow: 0 1px 0 rgba(255,255,255,.2); }
.sq .co { position: absolute; font-family: var(--font-num); font-weight: 800; font-size: 10px; font-size: 2.6cqw; line-height: 1; pointer-events: none; }
.sq .co.r { left: 3px; top: 3px; }
.sq .co.f { right: 3px; bottom: 2px; }
.sq.l .co { color: var(--sq-dark); }
.sq.d .co { color: var(--sq-light); }
.sq.sel { box-shadow: inset 0 0 0 4px #2f3d9c; background-image: linear-gradient(rgba(47,61,156,.22), rgba(47,61,156,.22)); }
.sq.from { box-shadow: inset 0 0 0 4px #d99a00; }
.sq .dot { position: absolute; width: 30%; height: 30%; border-radius: 50%; background: rgba(20, 30, 60, .32); pointer-events: none; }
.sq .dot.cap { width: 86%; height: 86%; background: none; border: 5px solid rgba(20, 30, 60, .32); }
.sq.pick { background-image: linear-gradient(rgba(47,61,156,.42), rgba(47,61,156,.42)); }
.sq.ok { background-image: linear-gradient(rgba(24,138,75,.55), rgba(24,138,75,.55)); }
.sq.ng { background-image: linear-gradient(rgba(199,58,58,.6), rgba(199,58,58,.6)); }
.sq.miss { box-shadow: inset 0 0 0 4px rgba(24,138,75,.9); }
.sq.last { background-image: linear-gradient(rgba(217,154,0,.38), rgba(217,154,0,.38)); }
.board-note { text-align: center; color: var(--muted); font-size: 13px; margin-top: 8px; }
.turn { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; }
.turn i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); display: inline-block; }
.turn i.w { background: #fff; }
.turn i.b { background: #222; }

/* ---- 麻雀牌 ---- */
.tile { width: var(--tw, 34px); aspect-ratio: 3 / 4; background: linear-gradient(180deg, var(--tile-face), var(--tile-face-2)); border: 1px solid var(--tile-edge); border-radius: 5px; box-shadow: 0 3px 0 var(--tile-back), 0 4px 6px rgba(0, 0, 0, .22); padding: 2px; display: inline-flex; flex: none; }
.tile svg { width: 100%; height: 100%; display: block; }
.tile text { font-family: var(--font-display); }
.hand { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 40px); gap: 2px; justify-content: center; align-items: end; margin: 8px 0 22px; }
.hand.few { grid-auto-columns: minmax(0, 54px); gap: 5px; }
.hand .tile, .hand .tbtn { width: 100%; }
.hand .tile { padding: 1px; }

<script>
/* 麻雀エンジン：アガリ判定・待ち計算・打牌候補・点数・牌の絵 */
const MJ = (() => {
  const SUITS = 'mpsz';
  const idx = (c) => SUITS.indexOf(c[1]) * 9 + (+c[0]) - 1;
  const code = (i) => (i % 9 + 1) + SUITS[Math.floor(i / 9)];
  const isHonor = (i) => i >= 27;
  const YAO = [0, 8, 9, 17, 18, 26, 27, 28, 29, 30, 31, 32, 33];

  function parse(str) {
    const out = []; let nums = [];
    for (const ch of String(str).replace(/\s/g, '')) {
      if (/[0-9]/.test(ch)) nums.push(ch);
      else if (SUITS.includes(ch)) { nums.forEach((n) => out.push(n + ch)); nums = []; }
    }
    return out;
  }
  function counts(codes) { const c = new Array(34).fill(0); codes.forEach((x) => c[idx(x)]++); return c; }
  function sortCodes(codes) { return [...codes].sort((a, b) => idx(a) - idx(b)); }
  function toStr(codes) {
    let s = '', cur = '', nums = '';
    for (const c of sortCodes(codes)) {
      if (c[1] !== cur) { if (cur) s += nums + cur; cur = c[1]; nums = ''; }
      nums += c[0];
    }
    return cur ? s + nums + cur : s;
  }

  // c を全部面子に分けられるなら面子の配列、だめなら null（c は呼び出し後に元に戻る）
  function meldsOf(c) {
    let i = 0; while (i < 34 && c[i] === 0) i++;
    if (i === 34) return [];
    if (c[i] >= 3) {
      c[i] -= 3; const r = meldsOf(c); c[i] += 3;
      if (r) return [[i, i, i], ...r];
    }
    if (!isHonor(i) && i % 9 <= 6 && c[i + 1] > 0 && c[i + 2] > 0) {
      c[i]--; c[i + 1]--; c[i + 2]--; const r = meldsOf(c); c[i]++; c[i + 1]++; c[i + 2]++;
      if (r) return [[i, i + 1, i + 2], ...r];
    }
    return null;
  }

  // 14枚のカウント → {kind, pair, melds} or null
  function agari(c) {
    const total = c.reduce((a, b) => a + b, 0);
    if (total !== 14) return null;
    for (let i = 0; i < 34; i++) {
      if (c[i] >= 2) {
        c[i] -= 2; const m = meldsOf(c); c[i] += 2;
        if (m) return { kind: 'std', pair: i, melds: m };
      }
    }
    if (c.filter((x) => x === 2).length === 7) return { kind: 'chiitoi' };
    if (YAO.every((i) => c[i] >= 1) && YAO.some((i) => c[i] === 2)) return { kind: 'kokushi' };
    return null;
  }

  // 13枚 → 待ち牌のインデックス配列
  function waits(c13) {
    const out = [];
    for (let t = 0; t < 34; t++) {
      if (c13[t] >= 4) continue;
      c13[t]++; if (agari(c13)) out.push(t); c13[t]--;
    }
    return out;
  }
  const remaining = (c13, ws) => ws.reduce((a, t) => a + (4 - c13[t]), 0);

  // 14枚 → テンパイになる打牌ごとの待ち
  function discards(codes14) {
    const c = counts(codes14); const res = [];
    for (let i = 0; i < 34; i++) {
      if (!c[i]) continue;
      c[i]--; const ws = waits(c); if (ws.length) res.push({ tile: i, waits: ws, count: remaining(c, ws) }); c[i]++;
    }
    return res;
  }

  function describe(a) {
    if (!a) return '';
    if (a.kind === 'chiitoi') return '七対子';
    if (a.kind === 'kokushi') return '国士無双';
    const meld = (m) => toStr(m.map(code));
    return [...a.melds.map(meld), toStr([code(a.pair), code(a.pair)])].join(' ／ ');
  }

  // --- ランダムな手 ---
  function randomComplete(rand, opts = {}) {
    const suits = opts.suits || 'mps';
    const honors = opts.honors !== false;
    const seqRate = opts.seqRate ?? 0.7;
    for (let tries = 0; tries < 200; tries++) {
      const c = new Array(34).fill(0); let ok = true;
      for (let m = 0; m < 4 && ok; m++) {
        let placed = false;
        for (let k = 0; k < 30 && !placed; k++) {
          if (rand() < seqRate) {
            const s = SUITS.indexOf(suits[Math.floor(rand() * suits.length)]);
            const st = s * 9 + Math.floor(rand() * 7);
            if (c[st] < 4 && c[st + 1] < 4 && c[st + 2] < 4) { c[st]++; c[st + 1]++; c[st + 2]++; placed = true; }
          } else {
            const pool = [];
            for (const ch of suits) { const s = SUITS.indexOf(ch); for (let n = 0; n < 9; n++) pool.push(s * 9 + n); }
            if (honors) for (let z = 27; z < 34; z++) pool.push(z);
            const t = pool[Math.floor(rand() * pool.length)];
            if (c[t] <= 1) { c[t] += 3; placed = true; }
          }
        }
        if (!placed) ok = false;
      }
      if (!ok) continue;
      const pool = [];
      for (const ch of suits) { const s = SUITS.indexOf(ch); for (let n = 0; n < 9; n++) pool.push(s * 9 + n); }
      if (honors) for (let z = 27; z < 34; z++) pool.push(z);
      const cand = pool.filter((t) => c[t] <= 2);
      const p = cand[Math.floor(rand() * cand.length)]; c[p] += 2;
      const out = []; c.forEach((n, i) => { for (let k = 0; k < n; k++) out.push(code(i)); });
      return out;
    }
    return parse('123m456p789s234s55z');
  }

  // --- 点数（ロン） ---
  function score(fu, han, dealer) {
    let base, name = '';
    if (han >= 13) { base = 8000; name = '役満'; }
    else if (han >= 11) { base = 6000; name = '三倍満'; }
    else if (han >= 8) { base = 4000; name = '倍満'; }
    else if (han >= 6) { base = 3000; name = '跳満'; }
    else if (han >= 5) { base = 2000; name = '満貫'; }
    else { base = fu * 2 ** (han + 2); if (base >= 2000) { base = 2000; name = '満貫'; } }
    const pts = Math.ceil(base * (dealer ? 6 : 4) / 100) * 100;
    return { pts, base, name };
  }

  // --- 牌の名前 ---
  const KAN = '一二三四五六七八九';
  const YOMI = ['イー', 'リャン', 'サン', 'スー', 'ウー', 'ロー', 'チー', 'パー', 'キュー'];
  const HON = ['東', '南', '西', '北', '白', '發', '中'];
  const HON_YOMI = ['トン', 'ナン', 'シャー', 'ペー', 'ハク', 'ハツ', 'チュン'];
  function name(c) {
    const i = typeof c === 'number' ? c : idx(c); const n = i % 9;
    if (i >= 27) return HON[i - 27];
    return (n + 1) + ['萬', '筒', '索'][Math.floor(i / 9)];
  }
  function yomi(c) {
    const i = typeof c === 'number' ? c : idx(c); const n = i % 9;
    if (i >= 27) return HON_YOMI[i - 27];
    return YOMI[n] + ['ワン', 'ピン', 'ソー'][Math.floor(i / 9)];
  }

  // --- 牌の絵（SVG）---
  const COL = { b: '#1d5fb4', r: '#c8312f', g: '#1f8a4c', k: '#1d1d1f' };
  const PIN = {
    1: [[15, 20, 9.5, 'r']],
    2: [[15, 11, 5, 'g'], [15, 29, 5, 'b']],
    3: [[8, 9, 4.2, 'b'], [15, 20, 4.2, 'r'], [22, 31, 4.2, 'g']],
    4: [[9, 11, 4.4, 'b'], [21, 11, 4.4, 'g'], [9, 29, 4.4, 'g'], [21, 29, 4.4, 'b']],
    5: [[8.5, 10, 4, 'b'], [21.5, 10, 4, 'g'], [15, 20, 4, 'r'], [8.5, 30, 4, 'g'], [21.5, 30, 4, 'b']],
    6: [[10, 8, 3.6, 'g'], [20, 8, 3.6, 'g'], [10, 20, 3.6, 'r'], [20, 20, 3.6, 'r'], [10, 31, 3.6, 'r'], [20, 31, 3.6, 'r']],
    7: [[7.5, 6.5, 3.1, 'g'], [15, 10, 3.1, 'g'], [22.5, 13.5, 3.1, 'g'], [10, 23, 3.4, 'r'], [20, 23, 3.4, 'r'], [10, 32, 3.4, 'r'], [20, 32, 3.4, 'r']],
    8: [[10, 6.5, 3.2, 'b'], [20, 6.5, 3.2, 'b'], [10, 15.5, 3.2, 'b'], [20, 15.5, 3.2, 'b'], [10, 24.5, 3.2, 'b'], [20, 24.5, 3.2, 'b'], [10, 33.5, 3.2, 'b'], [20, 33.5, 3.2, 'b']],
    9: [[7.5, 8, 3.2, 'b'], [15, 8, 3.2, 'b'], [22.5, 8, 3.2, 'b'], [7.5, 20, 3.2, 'r'], [15, 20, 3.2, 'r'], [22.5, 20, 3.2, 'r'], [7.5, 32, 3.2, 'g'], [15, 32, 3.2, 'g'], [22.5, 32, 3.2, 'g']],
  };
  // 索子: [x, y, 長さ, 色]
  const SOU = {
    2: [[15, 11, 13, 'g'], [15, 29, 13, 'g']],
    3: [[15, 11, 13, 'g'], [9, 29, 13, 'g'], [21, 29, 13, 'g']],
    4: [[9, 11, 13, 'g'], [21, 11, 13, 'g'], [9, 29, 13, 'g'], [21, 29, 13, 'g']],
    5: [[8, 11, 13, 'g'], [22, 11, 13, 'g'], [15, 20, 13, 'r'], [8, 29, 13, 'g'], [22, 29, 13, 'g']],
    6: [[7, 11, 13, 'g'], [15, 11, 13, 'g'], [23, 11, 13, 'g'], [7, 29, 13, 'g'], [15, 29, 13, 'g'], [23, 29, 13, 'g']],
    7: [[15, 6.5, 8, 'r'], [7, 18, 9, 'g'], [15, 18, 9, 'g'], [23, 18, 9, 'g'], [7, 31, 9, 'g'], [15, 31, 9, 'g'], [23, 31, 9, 'g']],
    8: [[5.5, 11, 13, 'g'], [12, 11, 13, 'g'], [18, 11, 13, 'g'], [24.5, 11, 13, 'g'], [5.5, 29, 13, 'g'], [12, 29, 13, 'g'], [18, 29, 13, 'g'], [24.5, 29, 13, 'g']],
    9: [[7, 7.5, 9, 'g'], [15, 7.5, 9, 'r'], [23, 7.5, 9, 'g'], [7, 20, 9, 'g'], [15, 20, 9, 'r'], [23, 20, 9, 'g'], [7, 32.5, 9, 'g'], [15, 32.5, 9, 'r'], [23, 32.5, 9, 'g']],
  };
  function svg(c) {
    const i = typeof c === 'number' ? c : idx(c); const n = i % 9 + 1; const s = Math.floor(i / 9);
    let body = '';
    if (s === 0) {
      body = `<text x="15" y="17" text-anchor="middle" font-size="14" font-weight="700" fill="${COL.k}">${KAN[n - 1]}</text>` +
        `<text x="15" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="${COL.r}">萬</text>`;
    } else if (s === 1) {
      body = PIN[n].map(([x, y, r, k]) =>
        `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${COL[k]}" stroke-width="${(r * 0.38).toFixed(2)}"/>` +
        `<circle cx="${x}" cy="${y}" r="${(r * 0.35).toFixed(2)}" fill="${COL[k]}"/>`).join('');
      if (n === 1) body += `<circle cx="15" cy="20" r="5.2" fill="none" stroke="${COL.g}" stroke-width="1.4"/>`;
    } else if (s === 2) {
      if (n === 1) {
        body = `<ellipse cx="15" cy="23" rx="7" ry="9" fill="${COL.g}"/>` +
          `<circle cx="15" cy="11" r="4.5" fill="${COL.g}"/><circle cx="16.5" cy="10" r="1.2" fill="#fff"/>` +

          `<path d="M11 20 q4 3 8 0" stroke="#fff" stroke-width="1.2" fill="none"/>`;
      } else {

          const w = n === 8 ? 3.4 : 4;
          return `<rect x="${x - w / 2}" y="${y - l / 2}" width="${w}" height="${l}" rx="${w / 2}" fill="${COL[k]}"/>` +
            `<rect x="${x - w / 2 - 0.4}" y="${y - 0.5}" width="${w + 0.8}" height="1" fill="#fbf8ef"/>`;
        }).join('');
      }
    } else {
      const z = n - 1;
      if (z === 4) body = `<rect x="6" y="8" width="18" height="24" rx="2" fill="none" stroke="${COL.b}" stroke-width="1.6"/>`;
      else {
        const col = z === 5 ? COL.g : z === 6 ? COL.r : COL.k;
        body = `<text x="15" y="27" text-anchor="middle" font-size="19" font-weight="800" fill="${col}">${HON[z]}</text>`;
      }
    }
    return `<svg viewBox="0 0 30 40" aria-hidden="true">${body}</svg>`;
  }

  return { SUITS, idx, code, parse, counts, sortCodes, toStr, agari, waits, remaining, discards, describe, randomComplete, score, name, yomi, svg, isHonor };
})();

    P.best = Math.max(P.best, P.streak);
    P.xp += xp; P.daily[d] = (P.daily[d] || 0) + xp;
    for (const k of Object.keys(P.daily)) if (k < daysAgo(60)) delete P.daily[k];
    if (L.key) { const r = P.lessons[L.key] || { n: 0, best: 0 }; r.n++; r.best = Math.max(r.best, acc); P.lessons[L.key] = r; }
    save();

  const expand = (s) => s.replace(/\bi'm\b/g, 'i am').replace(/\bcan't\b/g, 'cannot').replace(/\bwon't\b/g, 'will not').replace(/\b(\w+)n't\b/g, '$1 not')
    .replace(/\b(\w+)'re\b/g, '$1 are').replace(/\b(\w+)'ll\b/g, '$1 will').replace(/\b(\w+)'ve\b/g, '$1 have').replace(/\b(\w+)'d\b/g, '$1 would')
    .replace(/\blet's\b/g, 'let us').replace(/\b(it|that|what|how|there|he|she|who|where)'s\b/g, '$1 is').replace(/\bcan not\b/g, 'cannot');
  function lev(a, b) { const m = a.length, n = b.length; const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]); for (let j = 1; j <= n; j++) d[0][j] = j; for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[m][n]; }
  function rOrder(ex, ctx, host) {
    host.append(promptEl({ main: ex.main }));
    const line = h('div', { class: 'answer-line', 'aria-label': '答えの並び' });
    const bank = h('div', { class: 'bank' });
    const placed = [];
    ex.words.forEach((w, i) => {
      const src = h('button', { class: 'wtile ' + ex.cls }, w);
      src.onclick = () => {
        if (src.classList.contains('ghost')) return;
        src.classList.add('ghost');
        const t = h('button', { class: 'wtile ' + ex.cls }, w);
        t.onclick = () => { if (locked) return; t.remove(); placed.splice(placed.indexOf(i), 1); src.classList.remove('ghost'); ctx.ready(placed.length > 0); };
        t.dataset.i = i; line.append(t); placed.push(i); ctx.ready(true);
      };
      bank.append(src);
    });
    let locked = false;
    host.append(line, bank);
    const built = () => [...line.children].map((t) => ex.words[+t.dataset.i]).join(' ');
    return {
      check: () => ({ ok: norm(built()) === norm(ex.a), answer: ex.a }),
      reveal: () => ex.a,
      lock: () => { locked = true; [...bank.children].forEach((b) => { b.disabled = true; }); },
    };
  }
  function rType(ex, ctx, host) {
    host.append(promptEl({ main: ex.main }));
    const ta = h('textarea', { class: 'type-in', id: 'type-answer', placeholder: 'ここに英語で入力', autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false', 'aria-label': '答えを入力' });
    ta.addEventListener('input', () => ctx.ready(ta.value.trim().length > 0));
    ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.stopPropagation(); if (ta.value.trim()) ctx.finish(check()); } });
    host.append(ta);
    setTimeout(() => ta.focus({ preventScroll: true }), 50);
    function check() {
      const a = expand(norm(ta.value)), b = expand(norm(ex.a));
      if (a === b) return { ok: true };
      if (b.length > 8 && lev(a, b) <= 1) return { ok: true, note: '小さなタイプミスがあります：' + ex.a };
      return { ok: false, answer: ex.a };
    }
    return { check, reveal: () => ex.a, lock: () => { ta.disabled = true; } };
  }
  function rPairs(ex, ctx, host) {
    const L1 = shuffle(ex.pairs.map((p, i) => ({ i, text: p[0] })));
    const R1 = shuffle(ex.pairs.map((p, i) => ({ i, text: p[1] })));
    const grid = h('div', { class: 'pairs' }); const lc = h('div', { class: 'colp' }); const rc = h('div', { class: 'colp' });
    let selL = null, selR = null, left = ex.pairs.length, mistakes = 0;
    function tryMatch() {
      if (!selL || !selR) return;
      const a = selL, b = selR; selL = selR = null;
      if (a.dataset.i === b.dataset.i) {
        a.classList.remove('sel'); b.classList.remove('sel'); a.classList.add('ok'); b.classList.add('ok'); a.disabled = b.disabled = true; sfx('good');
        if (ex.cls === 'en' && canSpeak()) speak(ex.pairs[+a.dataset.i][0]);
        if (--left === 0) setTimeout(() => ctx.finish({ ok: true, ex: mistakes ? `ミス ${mistakes} 回。もう一息。` : 'ノーミス！' }), 250);
      } else {
        mistakes++; [a, b].forEach((x) => { x.classList.remove('sel'); x.classList.add('ng'); setTimeout(() => x.classList.remove('ng'), 350); });
      }
    }
    const mk = (o, side) => {
      const b = h('button', { class: 'pbtn ' + (side === 'L' ? ex.cls : '') }, o.text); b.dataset.i = o.i;
      b.onclick = () => {
        if (side === 'L') { if (selL) selL.classList.remove('sel'); selL = b; } else { if (selR) selR.classList.remove('sel'); selR = b; }
        b.classList.add('sel');
        if (side === 'L' && ex.cls === 'en' && canSpeak()) speak(o.text);
        tryMatch();
      };
      return b;
    };
    L1.forEach((o) => lc.append(mk(o, 'L'))); R1.forEach((o) => rc.append(mk(o, 'R')));
    grid.append(lc, rc); host.append(grid);
    return { auto: true, reveal: () => ex.pairs.map((p) => p.join(' ＝ ')).join(' ／ ') };
  }

  // チェス
  const GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
  const FILES = 'abcdefgh';
  function boardEl(game, flip, onTap) {
    const el = h('div', { class: 'board', role: 'grid', 'aria-label': 'チェス盤' });
    const sqs = {};
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const file = flip ? 7 - c : c; const rank = flip ? r + 1 : 8 - r; const name = FILES[file] + rank;
      const b = h('button', { class: 'sq ' + ((file + rank) % 2 === 1 ? 'd' : 'l'), 'aria-label': name, tabindex: onTap ? '0' : '-1' });
      if (c === 0) b.append(h('span', { class: 'co r' }, rank));
      if (r === 7) b.append(h('span', { class: 'co f' }, FILES[file]));
      if (onTap) b.onclick = () => onTap(name); else b.disabled = true;
      sqs[name] = b; el.append(b);
    }
    const paint = () => {
      for (const [name, b] of Object.entries(sqs)) {
        b.querySelectorAll('.pc,.dot').forEach((x) => x.remove());
        const p = game.get(name);
        if (p) { b.append(h('span', { class: 'pc ' + p.color }, GLYPH[p.type] + '︎')); b.setAttribute('aria-label', `${name} ${p.color === 'w' ? '白' : '黒'}${({ k: 'キング', q: 'クイーン', r: 'ルーク', b: 'ビショップ', n: 'ナイト', p: 'ポーン' })[p.type]}`); }
      }
    };
    paint();
    return { el, sqs, paint };
  }
  function turnNote(game, extra) {
    const w = game.turn() === 'w';
    return h('div', { class: 'board-note' }, h('span', { class: 'turn' }, h('i', { class: w ? 'w' : 'b' }), w ? '白の番' : '黒の番'), extra ? ' ・ ' + extra : '');
  }
  function staticBoard(fen) {
    const wrap = h('div', { class: 'board-wrap' });
    const fill = () => { const g = new window.Chess(fen); const b = boardEl(g, g.turn() === 'b', null); wrap.append(b.el, turnNote(g)); };
    if (window.Chess) fill(); else { wrap.append(h('div', { class: 'empty' }, '盤面を読み込み中…')); ensureChess().then((ok) => { wrap.replaceChildren(); if (ok) fill(); else wrap.append(h('div', { class: 'empty' }, 'チェス盤を読み込めませんでした。通信を確認して開き直してください。')); }); }
    return wrap;
  }
  function rChess(ex, ctx, host) {
    const wrap = h('div', { class: 'board-wrap' }); host.append(wrap);
    const api = { auto: ex.mode === 'move' };
    let game, B, sel = null, locked = false, picked = new Set(), target = [];
    function build() {
      game = new window.Chess(ex.fen);
      const flip = game.turn() === 'b';
      B = boardEl(game, flip, tap);
      if (ex.mode === 'squares') {
        target = game.moves({ square: ex.from, verbose: true }).map((m) => m.to);
        B.sqs[ex.from].classList.add('from');
        wrap.append(B.el, turnNote(game, `全部で ${new Set(target).size} マス`));
      } else wrap.append(B.el, turnNote(game, ex.goal === 'mate' ? '詰ませる手ならどれでも正解' : '駒をタップ → 行き先をタップ'));
    }
    function clearDots() { Object.values(B.sqs).forEach((b) => { b.classList.remove('sel'); b.querySelectorAll('.dot').forEach((d) => d.remove()); }); }
    function tap(name) {
      if (locked) return;
      if (ex.mode === 'squares') {
        if (name === ex.from) return;
        if (picked.has(name)) { picked.delete(name); B.sqs[name].classList.remove('pick'); } else { picked.add(name); B.sqs[name].classList.add('pick'); }
        ctx.ready(picked.size > 0); return;
      }
      const p = game.get(name);
      if (sel) {
        const mv = game.moves({ square: sel, verbose: true }).find((m) => m.to === name);
        if (mv) { doMove(sel, name); return; }
      }
      clearDots(); sel = null;
      if (p && p.color === game.turn()) {
        sel = name; B.sqs[name].classList.add('sel');
        const seen = new Set();
        game.moves({ square: name, verbose: true }).forEach((m) => { if (seen.has(m.to)) return; seen.add(m.to); B.sqs[m.to].append(h('span', { class: 'dot' + (m.captured ? ' cap' : '') })); });
      }
    }
    function solutionSan() {
      const g = new window.Chess(ex.fen);
      if (ex.goal === 'mate') { const m = g.moves({ verbose: true }).find((x) => { g.move(x); const r = g.in_checkmate(); g.undo(); return r; }); return m ? m.san : ''; }
      const mv = g.move({ from: ex.goal[0].slice(0, 2), to: ex.goal[0].slice(2, 4), promotion: 'q' }); return mv ? mv.san : '';
    }
    function doMove(from, to) {
      const before = game.fen();
      const m = game.move({ from, to, promotion: 'q' });
      clearDots(); locked = true;
      B.paint(); B.sqs[from].classList.add('last'); B.sqs[to].classList.add('last');
      let ok;
      if (ex.goal === 'mate') ok = game.in_checkmate();
      else ok = ex.goal.includes(from + to);
      const note = ok ? null : (ex.goal === 'mate' ? (game.in_check() ? `${m.san} はチェックだけど、逃げられる。` : `${m.san} はチェックになっていない。`) : null);
      setTimeout(() => {
        ctx.finish({ ok, answer: solutionSan(), note: note || (ok ? m.san + (game.in_checkmate() ? '（チェックメイト）' : '') : null) });
        if (!ok) setTimeout(() => { game.load(before); B.paint(); }, 900);
      }, 350);
    }
    api.check = () => {
      locked = true;
      const want = new Set(target);
      let ok = picked.size === want.size && [...picked].every((s) => want.has(s));
      for (const s of picked) B.sqs[s].classList.add(want.has(s) ? 'ok' : 'ng');
      for (const s of want) if (!picked.has(s)) B.sqs[s].classList.add('miss');
      Object.values(B.sqs).forEach((b) => b.classList.remove('pick'));
      const missN = [...want].filter((s) => !picked.has(s)).length; const extraN = [...picked].filter((s) => !want.has(s)).length;
      return { ok, note: ok ? null : `${missN ? `見落とし ${missN} マス（緑枠）` : ''}${missN && extraN ? '・' : ''}${extraN ? `行けないマス ${extraN}（赤）` : ''}` };
    };
    api.reveal = () => {
      locked = true;
      if (ex.mode === 'squares') { for (const s of target) B.sqs[s].classList.add('miss'); return `緑枠の ${new Set(target).size} マス`; }
      return solutionSan();
    };
    api.lock = () => { locked = true; };
    if (window.Chess) build();
    else {
      const ld = h('div', { class: 'empty' }, '盤面を読み込み中…'); wrap.append(ld);
      ensureChess().then((ok) => { ld.remove(); if (ok) build(); else wrap.append(h('div', { class: 'empty' }, 'チェス盤を読み込めませんでした。通信を確認して開き直してください。')); });
    }
    return api;
  }

  // 麻雀：何待ち
  function rWaits(ex, ctx, host) {
    const codes = MJ.parse(ex.hand); const c13 = MJ.counts(codes);
    const ws = MJ.waits(c13);
    host.append(handEl(codes));
    const suits = [...new Set(codes.map((x) => x[1]))].filter((s) => s !== 'z');
    const honors = [...new Set(codes.filter((x) => x[1] === 'z'))];
    const pal = h('div', { class: 'palette' }); const picked = new Set(); const btns = {};
    const mkBtn = (i) => { const b = h('button', { class: 'tbtn', 'aria-label': MJ.name(i), 'aria-pressed': 'false' }, tileEl(MJ.code(i))); b.onclick = () => { if (locked) return; if (picked.has(i)) picked.delete(i); else picked.add(i); b.classList.toggle('sel'); b.setAttribute('aria-pressed', String(picked.has(i))); ctx.ready(picked.size > 0); }; btns[i] = b; return b; };
    for (const s of suits) { const row = h('div', { class: 'prow' }); const base = MJ.SUITS.indexOf(s) * 9; for (let n = 0; n < 9; n++) row.append(mkBtn(base + n)); pal.append(row); }
    if (honors.length) { const row = h('div', { class: 'prow' }); honors.forEach((x) => row.append(mkBtn(MJ.idx(x)))); pal.append(row); }
    let locked = false;
    host.append(h('div', { class: 'palette-label' }, '待ちだと思う牌をすべてタップ'), pal);
    function detail() {
      const box = h('div', { class: 'fb-tiles' }, ...ws.map((t) => tileEl(MJ.code(t))), h('span', { class: 'num', style: 'margin-left:6px' }, `${ws.length}種 ${MJ.remaining(c13, ws)}枚`));
      const lines = ws.slice(0, 4).map((t) => { c13[t]++; const a = MJ.agari(c13); c13[t]--; return `${MJ.name(t)}：${MJ.describe(a)}`; });
      return h('div', {}, box, h('div', { class: 'fb-ex', style: 'margin-top:6px' }, lines.join('　')));
    }
    return {
      check: () => {
        locked = true; const want = new Set(ws);
        const ok = picked.size === want.size && [...picked].every((t) => want.has(t));
        for (const t of picked) btns[t].classList.add(want.has(t) ? 'right' : 'wrong');
        for (const t of want) if (!picked.has(t) && btns[t]) btns[t].classList.add('miss');
        return { ok, detail: detail(), answer: ok ? null : ws.map((t) => MJ.name(t)).join('・') };
      },
      reveal: () => { locked = true; for (const t of ws) if (btns[t]) btns[t].classList.add('miss'); return ws.map((t) => MJ.name(t)).join('・'); },
    };
  }
  // 麻雀：何切る
  function rDiscard(ex, ctx, host) {
    const codes = MJ.parse(ex.hand);
    const ds = MJ.discards(codes); const best = Math.max(...ds.map((d) => d.count));
    const bestSet = new Set(ds.filter((d) => d.count === best).map((d) => d.tile));
    const row = h('div', { class: 'hand' }); let sel = null; const btns = [];
    codes.forEach((c, k) => {
      const b = h('button', { class: 'tbtn', 'aria-label': MJ.name(c) + 'を切る' }, tileEl(c));
      b.onclick = () => { if (locked) return; btns.forEach((x) => x.classList.remove('sel')); b.classList.add('sel'); sel = MJ.idx(c); ctx.ready(true); };
      btns.push(b); row.append(b);
    });
    let locked = false;
    host.append(row, h('div', { class: 'palette-label' }, '切る牌をタップ（待ち枚数＝自分の手牌以外に残っている枚数）'));
    function table() {
      const t = h('table', { class: 'dtable' });
      [...ds].sort((a, b) => b.count - a.count).forEach((d) => {
        t.append(h('tr', {}, h('td', {}, '打 ', h('span', { class: 'mini' }, tileEl(MJ.code(d.tile)))), h('td', {}, h('span', { class: 'mini' }, ...d.waits.map((w) => tileEl(MJ.code(w))))), h('td', { class: 'num' }, `${d.count}枚${d.count === best ? ' ◎' : ''}`)));
      });
      return t;
    }
    return {
      check: () => {
        locked = true; const ok = bestSet.has(sel);
        btns.forEach((b, k) => { const i = MJ.idx(codes[k]); if (bestSet.has(i)) b.classList.add('right'); else if (i === sel) b.classList.add('wrong'); });
        const d = ds.find((x) => x.tile === sel);
        return { ok, note: d ? `選んだ打牌は ${d.waits.map((w) => MJ.name(w)).join('・')} 待ち ${d.count}枚` : 'その牌を切るとテンパイしない', answer: [...bestSet].map((i) => '打' + MJ.name(i)).join(' / '), detail: table() };
      },
      reveal: () => { locked = true; return [...bestSet].map((i) => '打' + MJ.name(i)).join(' / '); },
    };
  }

  // ---------- 設定 ----------
  function openSettings() {
    const bg = h('div', { class: 'sheet-bg', onclick: (e) => { if (e.target === bg) close(); } });
    const close = () => { bg.remove(); render(); };
    const sw = (key) => { const b = h('button', { class: 'switch' + (P[key] ? ' on' : ''), role: 'switch', 'aria-checked': String(!!P[key]) }); b.onclick = () => { P[key] = !P[key]; b.classList.toggle('on', P[key]); b.setAttribute('aria-checked', String(P[key])); save(); }; return b; };
    const seg = h('div', { class: 'seg', role: 'group', 'aria-label': '1日の目標XP' });
    [10, 20, 30, 50].forEach((v) => { const b = h('button', { class: P.goal === v ? 'on' : '' }, v); b.onclick = () => { P.goal = v; [...seg.children].forEach((x) => x.classList.toggle('on', x === b)); save(); }; seg.append(b); });
    let armed = false;
    const reset = h('button', { class: 'danger' }, '進捗をリセット');
    reset.onclick = () => { if (!armed) { armed = true; reset.textContent = 'もう一度押すと全部消えます'; return; } const keep = { goal: P.goal, sound: P.sound, reading: P.reading, autoplay: P.autoplay }; P = Object.assign(blank(), keep); save(); close(); };
    const syncEl = h('span', { 'data-sync': '' }); paintSync(syncEl);
    const sheet = h('div', { class: 'sheet', role: 'dialog', 'aria-label': '設定' },
      h('div', { class: 'srow' }, h('h3', {}, '設定'), h('button', { class: 'icon-btn', 'aria-label': '閉じる', onclick: close }, icon('close'))),
      h('div', { class: 'srow' }, h('div', { class: 'sl' }, h('b', {}, '1日の目標'), h('small', {}, 'レッスン1回で10〜20XP')), seg),
      h('div', { class: 'srow' }, h('div', { class: 'sl' }, h('b', {}, '効果音'), h('small', {}, '正解・不正解の音')), sw('sound')),
      h('div', { class: 'srow' }, h('div', { class: 'sl' }, h('b', {}, '英語の自動読み上げ'), h('small', {}, canSpeak() ? '問題が出たら発音を流す' : 'この環境では音声が使えません')), sw('autoplay')),
      h('div', { class: 'srow' }, h('div', { class: 'sl' }, h('b', {}, 'モンゴル語の読みを表示'), h('small', {}, 'ローマ字とカナ（目安）')), sw('reading')),
      h('div', { class: 'srow' }, h('div', { class: 'sl' }, h('b', {}, '保存先'), syncEl)),
      h('div', { class: 'srow' }, h('div', { class: 'sl' }, h('b', {}, '最長連続'), h('small', { class: 'num' }, `${P.best}日`)), reset));
    bg.append(sheet); document.body.append(bg);
    document.onkeydown = (e) => { if (e.key === 'Escape') { e.preventDefault(); close(); } };
  }

  // ---------- 起動 ----------
  render();
  initSpeech();
  initSync();
  setTimeout(ensureChess, 1500);
})();
</script>
